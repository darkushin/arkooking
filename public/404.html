<!--
  This 404.html file enables Single Page Application (SPA) routing for GitHub Pages.
  It encodes the requested path into the query string and redirects to the app root;
  a matching script in index.html decodes it back before the app loads.
  Source: https://github.com/rafgraph/spa-github-pages
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>arkooking</title>
    <script type="text/javascript">
      // Keep 1 path segment ("/arkooking") since this is a GitHub Pages project site
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
